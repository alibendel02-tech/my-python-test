name: Test on Windows VM

on: 
  workflow_dispatch: # Allows you to manually trigger this from the GitHub website

jobs:
  run-windows-script:
    runs-on: windows-latest  # Spawns a clean cloud-based Windows virtual machine

    steps:
      # 1. Pulls your repository files onto the Windows VM
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python (change version if needed, e.g., '3.11')
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install dependencies if you have a requirements.txt file
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # 4. Run your target script
      - name: Run script
        run: python system_repair.py